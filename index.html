<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>GROM RP</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a0a; --border: #222; --silver: #c0c0c0; --silver-light: #e8e8e8; --silver-dark: #888; --card-bg: rgba(20,20,20,0.75); }
    html, body { height: 100%; background: var(--bg); color: var(--silver); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
    
    /* фоновые текстуры */
    body::before { content: ''; position: fixed; inset: 0; z-index: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); opacity: 0.03; pointer-events: none; }
    body::after { content: ''; position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(192,192,192,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(192,192,192,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
    
    /* кнопка меню */
    #menu-btn { position: fixed; top: 24px; left: 24px; z-index: 1000; width: 44px; height: 44px; background: rgba(17,17,17,0.85); border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; cursor: pointer; backdrop-filter: blur(12px); transition: border-color 0.3s, background 0.3s; }
    #menu-btn:hover { border-color: var(--silver-dark); background: rgba(30,30,30,0.9); }
    #menu-btn span { display: block; width: 22px; height: 2px; background: var(--silver); border-radius: 2px; transition: transform 0.35s cubic-bezier(.77,0,.175,1), opacity 0.2s; transform-origin: center; }
    #menu-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    #menu-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    
    /* боковое меню */
    #drawer { position: fixed; top: 0; left: 0; z-index: 900; width: 280px; height: 100%; background: rgba(10,10,10,0.97); border-right: 1px solid var(--border); backdrop-filter: blur(20px); transform: translateX(-100%); transition: transform 0.4s cubic-bezier(.77,0,.175,1); display: flex; flex-direction: column; padding: 100px 28px 40px; }
    #drawer.open { transform: translateX(0); }
    #drawer .drawer-label { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--silver-dark); margin-bottom: 24px; }
    #drawer nav { display: flex; flex-direction: column; gap: 8px; }
    #drawer nav a { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 4px; text-decoration: none; color: var(--silver-light); font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; transition: background 0.25s, border-color 0.25s, color 0.25s, transform 0.2s; }
    #drawer nav a:hover { background: rgba(255,255,255,0.07); border-color: var(--silver-dark); color: #fff; transform: translateX(4px); }
    #drawer nav a .icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; opacity: 0.7; flex-shrink: 0; }
    #drawer nav a .icon svg { width: 20px; height: 20px; fill: currentColor; }
    #overlay { position: fixed; inset: 0; z-index: 800; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    #overlay.visible { opacity: 1; pointer-events: all; }
    
    /* основной контент */
    main { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 20px 100px; gap: 40px; }
    
    /* ЛОГОТИП: МАЛЕНЬКИЙ, ВВЕРХУ, БЕЗ АНИМАЦИИ */
    .logo-wrap { 
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
    .logo-img { 
      width: min(140px, 35vw);
      display: block;
      filter: drop-shadow(0 0 12px rgba(192,192,192,0.1));
    }
    
    /* КАРУСЕЛЬ — 3 горизонтальных квадрата */
    .carousel-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      padding: 0 40px;
    }
    .carousel-track-wrapper {
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--silver-dark) var(--border);
      border-radius: 12px;
    }
    .carousel-track-wrapper::-webkit-scrollbar {
      height: 6px;
    }
    .carousel-track-wrapper::-webkit-scrollbar-track {
      background: var(--border);
      border-radius: 4px;
    }
    .carousel-track-wrapper::-webkit-scrollbar-thumb {
      background: var(--silver-dark);
      border-radius: 4px;
    }
    .carousel-track {
      display: flex;
      gap: 24px;
      padding: 20px 16px;
      scroll-snap-type: x mandatory;
    }
    .card {
      flex: 0 0 min(320px, 75vw);
      scroll-snap-align: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(192,192,192,0.2);
      border-radius: 16px;
      padding: 24px 20px 32px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .card:hover {
      border-color: var(--silver-dark);
      transform: translateY(-5px);
      background: rgba(25,25,25,0.85);
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }
    .card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(192,192,192,0.3);
      background: #111;
    }
    .card-title {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--silver-light);
      line-height: 1.3;
    }
    /* кнопки стрелок */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--silver-dark);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 15;
      backdrop-filter: blur(8px);
      transition: background 0.2s, border-color 0.2s;
      font-size: 28px;
      font-weight: bold;
      color: var(--silver-light);
      user-select: none;
    }
    .carousel-btn:hover {
      background: rgba(192,192,192,0.2);
      border-color: var(--silver-light);
    }
    .btn-left { left: 0; }
    .btn-right { right: 0; }
    
    .divider { width: min(260px, 50vw); height: 1px; background: linear-gradient(90deg, transparent, var(--silver-dark), transparent); margin: 12px 0; }
    .download-wrap { display: flex; justify-content: center; }
    .btn-download { position: relative; display: inline-flex; align-items: center; gap: 14px; padding: 16px 40px; background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%); border: 1px solid var(--silver-dark); border-radius: 4px; text-decoration: none; color: var(--silver-light); font-family: 'Oswald', sans-serif; font-size: clamp(14px, 3vw, 18px); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; overflow: hidden; transition: all 0.3s; }
    .btn-download:hover { color: #fff; border-color: var(--silver-light); box-shadow: 0 0 20px rgba(192,192,192,0.12); }
    .btn-download::after { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); transition: left 0.5s; }
    .btn-download:hover::after { left: 150%; }
    .btn-download svg { width: 20px; height: 20px; fill: currentColor; }
    
    footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 10px 24px; border-top: 1px solid var(--border); background: rgba(10,10,10,0.8); backdrop-filter: blur(12px); text-align: center; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #444; }
    
    @media (max-width: 700px) {
      .carousel-container { padding: 0 20px; }
      .carousel-btn { width: 32px; height: 32px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <button id="menu-btn" aria-label="Меню"><span></span><span></span><span></span></button>
  <div id="overlay"></div>
  <aside id="drawer">
    <p class="drawer-label">Навигация</p>
    <nav>

  <main>
    <div class="logo-wrap">
      <img class="logo-img" src="https://imgfy.ru/ib/WhzTmn8U0osJNCg_1778605807.webp" alt="GROM RP">
    </div>
    
    <div class="carousel-container">
      <div class="carousel-btn btn-left" id="prevBtn">‹</div>
      <div class="carousel-track-wrapper" id="carouselWrapper">
        <div class="carousel-track" id="carouselTrack">

          </div>
          <!-- Блок 3 -->
          <div class="card">
            <img class="card-image" src="https://imgfy.ru/ib/cnNJpbY5jb3Nw4I_1778688217.webp " alt="Играй в своё удовольствие">

      <a href="#" class="btn-download"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Скачать лаунчер</a>
    </div>
  </main>
  <footer>GROM RP © 2025</footer>

  <script>
    // Меню
    const menuBtn = document.getElementById('menu-btn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    function toggleMenu() {
      const isOpen = drawer.classList.contains('open');
      drawer.classList.toggle('open');
      overlay.classList.toggle('visible');
      menuBtn.classList.toggle('open');
      document.body.style.overflow = isOpen ? '' : 'hidden';
    }
    menuBtn.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);
    document.querySelectorAll('#drawer nav a').forEach(link => {
      link.addEventListener('click', () => { if (drawer.classList.contains('open')) toggleMenu(); });
    });
    
    // Карусель (горизонтальная прокрутка по кнопкам)
    const wrapper = document.getElementById('carouselWrapper');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    function scrollBy(direction) {
      if (!wrapper) return;
      const scrollAmount = wrapper.clientWidth * 0.9;
      wrapper.scrollBy({ left: direction === 'left' ? -scrollAmount : scrollAmount, behavior: 'smooth' });
    }
    if (prevBtn && nextBtn) {
      prevBtn.addEventListener('click', () => scrollBy('left'));
      nextBtn.addEventListener('click', () => scrollBy('right'));
    }
  </script>
</body>
</html>
