<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROM RP</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a0a; --border: #222; --silver: #c0c0c0; --silver-light: #e8e8e8; --silver-dark: #888; }
    html, body { height: 100%; background: var(--bg); color: var(--silver); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; z-index: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); opacity: 0.03; pointer-events: none; }
    body::after { content: ''; position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(192,192,192,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(192,192,192,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
    #menu-btn { position: fixed; top: 24px; left: 24px; z-index: 1000; width: 44px; height: 44px; background: rgba(17,17,17,0.85); border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; cursor: pointer; backdrop-filter: blur(12px); transition: border-color 0.3s, background 0.3s; }
    #menu-btn:hover { border-color: var(--silver-dark); background: rgba(30,30,30,0.9); }
    #menu-btn span { display: block; width: 22px; height: 2px; background: var(--silver); border-radius: 2px; transition: transform 0.35s cubic-bezier(.77,0,.175,1), opacity 0.2s; transform-origin: center; }
    #menu-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    #menu-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    #drawer { position: fixed; top: 0; left: 0; z-index: 900; width: 280px; height: 100%; background: rgba(10,10,10,0.97); border-right: 1px solid var(--border); backdrop-filter: blur(20px); transform: translateX(-100%); transition: transform 0.4s cubic-bezier(.77,0,.175,1); display: flex; flex-direction: column; padding: 100px 28px 40px; }
    #drawer.open { transform: translateX(0); }
    #drawer .drawer-label { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--silver-dark); margin-bottom: 24px; }
    #drawer nav { display: flex; flex-direction: column; gap: 8px; }
    #drawer nav a { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 4px; text-decoration: none; color: var(--silver-light); font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; transition: background 0.25s, border-color 0.25s, color 0.25s, transform 0.2s; }
    #drawer nav a:hover { background: rgba(255,255,255,0.07); border-color: var(--silver-dark); color: #fff; transform: translateX(4px); }
    #drawer nav a .icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; opacity: 0.7; flex-shrink: 0; }
    #drawer nav a .icon svg { width: 20px; height: 20px; fill: currentColor; }
    #overlay { position: fixed; inset: 0; z-index: 800; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    #overlay.visible { opacity: 1; pointer-events: all; }
    main { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 48px; }
    .logo-wrap { display: flex; justify-content: center; align-items: center; animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both; }
    .logo-img { width: min(520px, 88vw); display: block; filter: drop-shadow(0 0 40px rgba(192,192,192,0.12)); animation: floatLogo 6s ease-in-out infinite; }
    @keyframes floatLogo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .divider { width: min(320px, 60vw); height: 1px; background: linear-gradient(90deg, transparent, var(--silver-dark), transparent); }
    .download-wrap { display: flex; justify-content: center; animation: fadeUp 1.2s cubic-bezier(.22,1,.36,1) 0.15s both; }
    .btn-download { position: relative; display: inline-flex; align-items: center; gap: 14px; padding: 18px 44px; background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%); border: 1px solid var(--silver-dark); border-radius: 4px; text-decoration: none; color: var(--silver-light); font-family: 'Oswald', sans-serif; font-size: clamp(16px, 3vw, 20px); font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; overflow: hidden; transition: color 0.3s, border-color 0.3s, box-shadow 0.3s; }
    .btn-download::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(192,192,192,0.08), rgba(192,192,192,0)); opacity: 0; transition: opacity 0.3s; }
    .btn-download:hover { color: #fff; border-color: var(--silver-light); box-shadow: 0 0 30px rgba(192,192,192,0.12), 0 0 60px rgba(192,192,192,0.05); }
    .btn-download:hover::before { opacity: 1; }
    .btn-download::after { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); transition: left 0.5s; }
    .btn-download:hover::after { left: 150%; }
    .btn-download svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 12px 24px; border-top: 1px solid var(--border); background: rgba(10,10,10,0.8); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #333; }
  </style>
</head>
